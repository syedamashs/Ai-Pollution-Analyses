<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GreenMadurai - Pollution Analysis{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">🌿</div>
                <div>
                    <h1>GreenMadurai</h1>
                    <p>Multi-City AI System</p>
                </div>
            </div>

            <nav>
                <button class="nav-item {% if request.endpoint == 'index' %}active{% endif %}"
                    onclick="navigateTo('/')">
                    <span class="nav-icon">🏠</span>
                    <span>Home</span>
                </button>
                <button class="nav-item {% if request.endpoint == 'area_analysis' %}active{% endif %}"
                    onclick="navigateTo('/area-analysis')">
                    <span class="nav-icon">📍</span>
                    <span>Area Analysis</span>
                </button>
                <button class="nav-item {% if request.endpoint == 'aqi_trees' %}active{% endif %}"
                    onclick="navigateTo('/aqi-trees')">
                    <span class="nav-icon">💨</span>
                    <span>AQI & Trees</span>
                </button>
                <button class="nav-item {% if request.endpoint == 'forecasting' %}active{% endif %}"
                    onclick="navigateTo('/forecasting')">
                    <span class="nav-icon">🔮</span>
                    <span>Forecasting</span>
                </button>
                <button class="nav-item {% if request.endpoint == 'model_evaluation' %}active{% endif %}"
                    onclick="navigateTo('/model-evaluation')">
                    <span class="nav-icon">🧪</span>
                    <span>Model Evaluation</span>
                </button>
                <button class="nav-item {% if request.endpoint == 'about' %}active{% endif %}"
                    onclick="navigateTo('/about')">
                    <span class="nav-icon">ℹ️</span>
                    <span>About Project</span>
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <button class="header-btn" id="menu-btn" onclick="toggleSidebar()" style="display: none;">
                        <span>☰</span>
                    </button>
                    <div class="header-title">
                        <h2>Dashboard</h2>
                        <p>Madurai City Environmental Analysis</p>
                    </div>
                </div>
                <div class="header-right">
                    <button class="header-btn">
                        <span>🔔</span>
                        <span class="notification-badge"></span>
                    </button>
                    <button class="header-btn">
                        <span>👤</span>
                    </button>
                </div>
            </header>

            <!-- Main Content Area -->
            <main>
                <div class="page-container">
                    {% block content %}{% endblock %}
                </div>
            </main>

            <!-- Footer -->
            <footer>
                <p>&copy; 2026 GreenMadurai. AI-Powered Environmental Monitoring System for Madurai City.</p>
            </footer>
        </div>
    </div>

    <script>
        function navigateTo(url) {
            window.location.href = url;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        // Show menu button on mobile
        function checkResponsive() {
            const menuBtn = document.getElementById('menu-btn');
            if (window.innerWidth <= 768) {
                menuBtn.style.display = 'flex';
            } else {
                menuBtn.style.display = 'none';
            }
        }

        window.addEventListener('resize', checkResponsive);
        checkResponsive();
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
